services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./redclaw/skills:/app/redclaw/skills
      - /home/pi/redclaw_workspace:/home/pi/redclaw_workspace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  discordbot:
    build:
      context: .
      dockerfile: docker/Dockerfile.discord
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./redclaw/skills:/app/redclaw/skills
      - /home/pi/redclaw_workspace:/home/pi/redclaw_workspace
    restart: unless-stopped
    depends_on:
      - web

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./redclaw/skills:/app/redclaw/skills
      - /home/pi/redclaw_workspace:/home/pi/redclaw_workspace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"
